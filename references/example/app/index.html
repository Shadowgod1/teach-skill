<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Дела</title>
<style>
body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:#f5f6fa;color:#1d2330}
header{background:#fff;border-bottom:1px solid #e3e6ee;padding:18px 48px;display:flex;align-items:center;gap:14px}
.logo{width:34px;height:34px;border-radius:9px;background:#ff6b3d;color:#fff;display:grid;place-items:center;font-weight:800}
header h1{font-size:22px;margin:0}
main{max-width:760px;margin:48px auto;padding:0 24px}
h2{font-size:30px;margin:0 0 24px}
form{display:flex;gap:12px}
#title{flex:1;font-size:18px;padding:14px 16px;border:1px solid #d5d9e3;border-radius:10px;background:#fff}
#add{font-size:18px;font-weight:600;padding:0 26px;border:0;border-radius:10px;background:#ff6b3d;color:#fff}
.filters{display:flex;gap:8px;margin:28px 0 14px}
.filters button{border:1px solid #d5d9e3;background:#fff;border-radius:999px;padding:8px 18px;font-size:15px}
.filters button.on{background:#1d2330;color:#fff;border-color:#1d2330}
ul{list-style:none;padding:0;margin:0;background:#fff;border:1px solid #e3e6ee;border-radius:12px}
li{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid #eef0f5;font-size:18px}
li:last-child{border-bottom:0} li.done span{text-decoration:line-through;color:#9aa1b0}
li input{width:22px;height:22px;accent-color:#ff6b3d}
.empty{padding:28px;text-align:center;color:#9aa1b0}
</style></head><body>
<header><div class="logo">Д</div><h1>Дела</h1></header>
<main><h2>Мои задачи</h2>
<form id="f"><input id="title" placeholder="Что нужно сделать?"><button id="add">Добавить</button></form>
<div class="filters"><button class="on" data-f="all">Все</button><button data-f="active">Активные</button><button data-f="done">Готовые</button></div>
<ul id="list"></ul></main>
<script>
let items=[{t:'Позвонить в банк',d:true},{t:'Оплатить интернет',d:false}],filter='all';
const L=document.getElementById('list');
function draw(){const v=items.filter(i=>filter==='all'||(filter==='done')===i.d);
L.innerHTML=v.length?v.map((i,k)=>`<li class="${i.d?'done':''}"><input type="checkbox" ${i.d?'checked':''} data-i="${items.indexOf(i)}"><span>${i.t}</span></li>`).join(''):'<div class="empty">Пока пусто</div>'}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const x=document.getElementById('title');if(x.value.trim()){items.push({t:x.value.trim(),d:false});x.value='';draw()}};
L.onchange=e=>{items[e.target.dataset.i].d=e.target.checked;draw()};
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelector('.filters .on').classList.remove('on');b.classList.add('on');filter=b.dataset.f;draw()});
draw();
</script></body></html>
